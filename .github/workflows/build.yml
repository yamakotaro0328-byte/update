name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Run Gradle itself on JDK 21 (Gradle 8.x can't run on JDK 25 yet; JDK 25 is only used as the compile toolchain)
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AutoUpdater
          path: build/libs/*.jar

      # Actions のアーティファクトは GitHub ログインが無いとダウンロードできないため、
      # ログイン不要でダウンロードできる公開 Release にも同じ jar を置く (push のたびに上書き)。
      - name: Publish as a public download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          files: build/libs/*.jar
