# =====================================================
#  AutoUpdater 設定ファイル
# =====================================================

auto-update:
  # 自動アップデート機能全体の有効/無効
  enabled: true

  # サーバー起動時に一度だけ自動でチェックを行うか
  update-on-startup: true

  # 何分ごとに自動でアップデートを確認するか
  check-interval-minutes: 30

  # 更新が見つかった場合、自動でダウンロードして plugins/update/ に配置するか
  # false の場合は確認と通知のみ行い、ダウンロードは /autoupdate update で手動実行する
  download-updates: true

  # 管理者(autoupdater.admin 権限保持者)へ通知するか
  notify-admin: true

# -----------------------------------------------------
# サーバーの Minecraft バージョン (互換性チェックに使用)
# 空の場合は Bukkit.getMinecraftVersion() から自動検出する
# -----------------------------------------------------
minecraft:
  current-version: ""

# -----------------------------------------------------
# セキュリティ設定
# -----------------------------------------------------
security:
  # HTTPS 以外の URL からのダウンロードを禁止する
  https-only: true

  # SHA-256 ハッシュの検証を必須にするか
  # true の場合、配布元からハッシュ値を取得できないアップデートは適用しない
  require-hash: false

  # 接続タイムアウト(秒)
  connect-timeout-seconds: 10

  # 読み取りタイムアウト(秒)
  read-timeout-seconds: 30

  # ダウンロード可能な最大ファイルサイズ(MB)
  max-file-size-mb: 100

# -----------------------------------------------------
# 更新元のデフォルト設定
# -----------------------------------------------------
update-source:
  # デフォルトの更新元タイプ: github もしくは custom
  default-type: "github"

  github:
    # GitHub API のベース URL (通常は変更不要)
    api-base-url: "https://api.github.com"

  # 将来的な独自アップデートサーバー対応 (現時点では未実装/実験的機能)
  custom-server:
    enabled: false
    # https:// で始まる URL のみ許可される
    base-url: ""

# -----------------------------------------------------
# バックアップ設定
# -----------------------------------------------------
backup:
  enabled: true
  # plugins/backups/ に保持する各プラグインごとのバックアップ数
  keep-count: 5

# -----------------------------------------------------
# Discord Webhook 通知 (将来的な機能拡張用)
# -----------------------------------------------------
discord:
  enabled: false
  webhook-url: ""
